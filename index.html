<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="description" content="AdminLTE 4 admin dashboard built as a Vue 3 single-page application." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <title>AdminLTE 4 | Vue</title>

    <!-- Pre-paint theme init: must stay inline so the first paint uses the right
         theme. Mirrors AdminLTE's precedence: stored choice, authored theme, OS. -->
    <script>
      (() => {
        'use strict'
        const root = document.documentElement
        if (root.getAttribute('data-lte-color-mode') === 'off') return

        const STORAGE_KEY = 'appTheme'
        let stored = null
        try {
          stored = localStorage.getItem(STORAGE_KEY)
        } catch {
          // localStorage may be unavailable (private mode, sandboxed iframe).
        }

        const authored = root.getAttribute('data-bs-theme')
        let resolved = 'light'
        if (stored === 'dark' || stored === 'light') resolved = stored
        else if (authored === 'dark' || authored === 'light') resolved = authored
        else if (globalThis.matchMedia('(prefers-color-scheme: dark)').matches) resolved = 'dark'

        root.setAttribute('data-bs-theme', resolved)
        root.style.colorScheme = resolved
        // Flag values computed here, so the theme composable does not mistake a
        // computed value for a theme the page declared itself.
        if (resolved !== authored) root.setAttribute('data-appTheme-resolved', '')
      })()
    </script>
  </head>
  <body class="layout-fixed fixed-header sidebar-expand-lg sidebar-mini bg-body-tertiary">
    <div id="app"></div>
    <script>
      // The mini sidebar starts collapsed; restore an explicit open choice before
      // first paint to avoid a layout jump.
      (() => {
        try {
          if (localStorage.getItem('appSidebarState') !== 'sidebar-open') {
            document.body.classList.add('sidebar-collapse')
          }
        } catch {
          // localStorage may be unavailable; keep the collapsed default.
          document.body.classList.add('sidebar-collapse')
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
